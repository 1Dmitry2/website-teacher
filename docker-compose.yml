services:
  postgres:
    image: postgres:16-alpine
    container_name: teacher-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restapi_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teacher-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: teacher-backend
    environment:
      - DATABASE_URL=host=postgres dbname=${POSTGRES_DB:-restapi_prod} user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-changeme} sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ADMIN_RESET_URL=${ADMIN_RESET_URL:-http://localhost/admin/reset?token=}
      - USER_VERIFICATION_URL=${USER_VERIFICATION_URL:-http://localhost/verify-email?token=}
      - USER_RESET_URL=${USER_RESET_URL:-http://localhost/reset-password?token=}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost}
      - UPLOAD_DIR=/root/uploads
    volumes:
      - uploads_data:/root/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - teacher-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://backend:8080}
    container_name: teacher-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - teacher-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: teacher-nginx
    volumes:
      - ./Deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8000}:80"
    depends_on:
      - frontend
      - backend
    networks:
      - teacher-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  teacher-network:
    driver: bridge

